name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: brew install tmux
      - run: python -m pip install --upgrade pip
      # The lint rule set is pinned in pyproject.toml, so ruff does not need a
      # version ceiling here to keep `ruff check .` reproducible.
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q mutual_review_room
      - run: bash -n scripts/mutual-review-room
      - name: Smoke installed console script outside the checkout
        working-directory: /tmp
        run: mutual-review-room --help
