name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . "ruff>=0.15,<0.16"
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q mutual_review_room
      - run: bash -n scripts/mutual-review-room
      - name: Smoke installed console script outside the checkout
        working-directory: /tmp
        run: mutual-review-room --help
