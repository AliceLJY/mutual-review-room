[project]
name = "mutual-review-room"
version = "0.1.0"
description = "Owner-led terminal rooms for persistent multi-model review"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AliceLJY" },
]
keywords = ["ai-agents", "multi-agent", "review", "tmux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.15"]

[project.scripts]
mutual-review-room = "mutual_review_room.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mutual_review_room"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than left to the default. Ruff's default rule set
# widened in 0.16, so an unpinned `ruff check .` passed on the version used to
# write this code and reported 54 findings on a newer one. Selecting the rules
# keeps the documented command reproducible across ruff versions.
select = ["E4", "E7", "E9", "F"]
