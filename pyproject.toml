[project]
name = "mutual-review-room"
version = "0.1.0"
description = "Owner-led terminal rooms for persistent multi-model review"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AliceLJY" },
]
keywords = ["ai-agents", "multi-agent", "review", "tmux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mutual-review-room = "mutual_review_room.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mutual_review_room"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100
